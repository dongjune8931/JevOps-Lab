# Only for the owned local kind cluster. This daemon is privileged inside its node.
images:
  tag: v2.8.4
enableProfiling: false
controllerManager:
  replicaCount: 1
  leaderElection:
    enabled: false
  enableFilterNamespace: true
  allowHostNetworkTesting: false
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  podChaos:
    podFailure:
      pauseImage: registry.k8s.io/pause:3.10
chaosDaemon:
  runtime: containerd
  socketPath: /run/containerd/containerd.sock
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
dashboard:
  create: false
dnsServer:
  create: false
prometheus:
  create: false
